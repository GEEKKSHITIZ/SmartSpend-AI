<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - SmartSpend AI</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <h1>SmartSpend AI</h1>

            <h2>Login</h2>

            <p>
                Login to access your financial dashboard.
            </p>

            {% if error %}
                <div
                    class="error-message"
                    role="alert"
                >
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        value="{{ email or '' }}"
                        autocomplete="email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>

                <button type="submit">
                    Login
                </button>

            </form>

            <p>
                Don't have an account?

                <a href="{{ url_for('signup') }}">
                    Create Account
                </a>
            </p>

        </div>

    </div>

</body>

</html>
